[dds]
strNetworkInterface = ens33     ; Client network interface connected to the robot; check with ip -br link.
domain_id = 50     ; External DDS domain used by the robot DDS_Bridge.

[head]
sourceName = aheadform_sdk

[media]
isVideoCaptureOn = 0     ; Start SDK capture of the robot video stream during initialization.
isMicCaptureOn = 0     ; Start SDK capture of the robot MIC stream during initialization.
isSdkPlayAudioOn = 0     ; Start the SDK-provided audio path to the robot speaker during initialization.
multicastAddress = 239.255.42.1     ; Match the robot Gateway video and MIC multicast group.
strRobotIPv4 = 192.168.110.51     ; Set the actual robot IPv4 before starting SDK audio playback.
videoPort = 5600
micPort = 5602
spkPort = 5604
videoPayloadType = 96
micPayloadType = 96
spkPayloadType = 96
jitterBufferLatencyMax_ms = 60     ; RTP jitter-buffer latency budget with drop-on-latency enabled.
rtpMtu = 1400     ; RTP packet byte budget; independent of the complete video AU capacity.
videoFrameSizeMax = 0     ; Set the estimated maximum H.264 AU bytes before starting video capture.
